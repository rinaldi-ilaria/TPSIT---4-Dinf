
<!DOCTYPE html>
<html>
<head>
    <title>Maschera Dati Personali</title>
</head>
<body>
    <h2>Inserimento dati personali</h2>
    <form id="modulo">
        Nome:
        <input type="text" id="nome">
        <br><br>
        Cognome:
        <input type="text" id="cognome">
        <br><br>
        Età:
        <input type="number" id="eta">
        <br><br>
        Sesso:
        <input type="radio" name="sesso" value="Maschio"> Maschio
        <input type="radio" name="sesso" value="Femmina"> Femmina
        <br><br>
        Indirizzo:
        <input type="text" id="indirizzo">
        <br><br>
        Città:
        <input type="text" id="citta">
        <br><br>
        Provincia:
        <select id="provincia">
            <option value="Milano">Milano</option>
            <option value="Roma">Roma</option>
            <option value="Torino">Torino</option>
            <option value="Bergamo">Bergamo</option>
            <option value="Brescia">Brescia</option>
        </select>
        <br><br>
        Sport praticati:
        <br>
        <input type="checkbox" name="sport" value="Calcio"> Calcio
        <input type="checkbox" name="sport" value="Nuoto"> Nuoto
        <input type="checkbox" name="sport" value="Tennis"> Tennis
        <input type="checkbox" name="sport" value="Pallavolo"> Pallavolo
        <br><br>
        Commenti:
        <br>
        <textarea id="commenti" rows="4" cols="30"></textarea>
        <br><br>
        <input type="button" value="Stampa dati" onclick="stampaDati()">
    </form>
    <h2>Dati inseriti</h2>
    <table border="1" id="tabella" cellpadding="5">
        <tr>
            <th>Campo</th>
            <th>Valore</th>
        </tr>
    </table>
    <script>
        function stampaDati() {
            let nome = document.getElementById("nome").value;
            let cognome = document.getElementById("cognome").value;
            let eta = document.getElementById("eta").value;
            let indirizzo = document.getElementById("indirizzo").value;
            let citta = document.getElementById("citta").value;
            let provincia = document.getElementById("provincia").value;
            let commenti = document.getElementById("commenti").value;
            let sesso = document.querySelector('input[name="sesso"]:checked');
            if (sesso != null) {
                sesso = sesso.value;
            } else {
                sesso = "Non selezionato";
            }
            let sport = document.querySelectorAll('input[name="sport"]:checked');
            let elencoSport = "";
            sport.forEach(function(elemento) {
                elencoSport += elemento.value + " ";
            });
            if (elencoSport == "") {
                elencoSport = "Nessuno";
            }
            let tabella = document.getElementById("tabella");
            tabella.innerHTML = `
                <tr>
                    <th>Campo</th>
                    <th>Valore</th>
                </tr>
                <tr><td>Nome</td><td>${nome}</td></tr>
                <tr><td>Cognome</td><td>${cognome}</td></tr>
                <tr><td>Età</td><td>${eta}</td></tr>
                <tr><td>Sesso</td><td>${sesso}</td></tr>
                <tr><td>Indirizzo</td><td>${indirizzo}</td></tr>
                <tr><td>Città</td><td>${citta}</td></tr>
                <tr><td>Provincia</td><td>${provincia}</td></tr>
                <tr><td>Sport praticati</td><td>${elencoSport}</td></tr>
                <tr><td>Commenti</td><td>${commenti}</td></tr>
            `;
        }
    </script>
</body>
</html>
